# This machine has 7.8 GB. Asking for an 8 GB daemon heap plus a 4 GB
# metaspace on it is what got release builds OOM-killed here - the build died
# part-way through `assembleRelease`, leaving the *previous* APK in place, so a
# failed build could quietly be mistaken for a successful one.
#
# These are the settings the driver app was already tuned to on this same box,
# and they build it reliably. Build configuration only: nothing about what the
# app does changes.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=false
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process
# Large Android Gradle Plugin artifacts can exceed Gradle's default HTTP
# timeouts on slower or unstable connections.
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=300000
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
